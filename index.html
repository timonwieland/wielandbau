<!DOCTYPE html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Die Website von Wieland Bau wird derzeit überarbeitet. Holzbau und Handwerk von Janis Wieland."
    />
    <meta name="robots" content="index, follow" />
    <title>Website im Umbau | Wieland Bau</title>
    <link rel="stylesheet" href="maintenance.css" />
  </head>
  <body>
    <main class="maintenance-page">
      <div class="maintenance-page__backdrop" aria-hidden="true"></div>

      <header class="site-header">
        <div class="brand" aria-label="Wieland Bau – Holzbau &amp; Handwerk">
          <img class="brand__mark" src="assets/wb-wielandbau.svg" alt="" />
          <span class="brand__text">
            <strong>Wieland Bau</strong>
            <span>Holzbau &amp; Handwerk</span>
          </span>
        </div>

        <a class="header-phone" href="tel:+41788297577">
          +41 78 829 75 77
        </a>
      </header>

      <section class="maintenance-content" aria-labelledby="page-title">
        <p class="eyebrow">Wieland Bau</p>
        <h1 id="page-title">Hier wird<br />umgebaut.</h1>
        <p class="intro">
          Unsere Website bekommt gerade einen neuen Auftritt. Auf der Baustelle
          bin ich wie gewohnt für dich da.
        </p>

        <div class="contact-actions" aria-label="Kontaktmöglichkeiten">
          <a class="contact-button contact-button--primary" href="tel:+41788297577">
            <span class="contact-button__label">Anrufen</span>
            <span>+41 78 829 75 77</span>
          </a>
          <a
            class="contact-button contact-button--secondary"
            href="mailto:info@wielandbau.ch"
          >
            <span class="contact-button__label">E-Mail</span>
            <span>info@wielandbau.ch</span>
          </a>
        </div>
      </section>

      <footer class="site-footer">
        <span>Holzbau &amp; Handwerk</span>
        <span>Janis Wieland</span>
      </footer>
    </main>
  </body>
</html>
